<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Bubble Sort</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Bubble Sort</h1>

    <div class="caixa">

        <p>Digite os números separados por vírgula:</p>

        <input type="text" id="numeros" placeholder="5, 3, 8, 1, 2">

        <br><br>

        <button id="btnComecar">Começar</button>
        <button id="btnGerar">Gerar números</button>
        <button id="btnParar">Pausar</button>
        <button id="btnLimpar">Limpar</button>

        <h3>Gráfico:</h3>

        <div id="grafico"></div>

        <p id="passo">Digite os números e clique em começar.</p>

        <h3>Resultado:</h3>

        <div id="resultado">-</div>

    </div>

    <script src="script.js"></script>

</body>
</html>
